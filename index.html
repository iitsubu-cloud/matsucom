<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>MatsuCom</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

  <!-- 起動画面 -->
  <main id="screen-start" class="screen">
    <h1>MatsuCom</h1>

    <p class="label">自分の役割</p>
    <div id="role-buttons" class="roles"></div>

    <label class="label" for="passphrase">合言葉</label>
    <input id="passphrase" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">

    <button id="start-btn" type="button" class="start-btn" disabled>通信開始</button>
    <p id="start-error" class="start-error" role="alert" hidden></p>
  </main>

  <!-- メイン画面 -->
  <div id="screen-main" class="screen screen-main" hidden>
    <div class="map-wrap">
      <div id="map"></div>
      <div id="talker-banner" class="talker-banner" role="status" aria-live="polite" hidden></div>
      <div class="hud">
        <div id="mode-badge" hidden>ローカル試験モード</div>
        <div id="notice"></div>
        <div id="peer-status"></div>
      </div>
    </div>
    <div class="ptt-area">
      <button id="ptt-btn" type="button" class="ptt-btn">押して話す</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script type="module" src="js/app.js?v=2"></script>
</body>
</html>
